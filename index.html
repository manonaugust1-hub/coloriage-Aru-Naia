<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Carrousel Cheval Blanc Saint Barth</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--brand:#736562;--font:"Copperplate Gothic","Copperplate","Copperplate Gothic Light",Georgia,serif;--sw:210px}
html,body{width:100%;height:100%;overflow:hidden;background:var(--brand);font-family:var(--font);user-select:none;touch-action:none}

/* ── LAYOUT ── */
#app{display:flex;width:100vw;height:100vh}
#canvas-wrap{flex:1;position:relative;background:#fff;overflow:hidden}
canvas{position:absolute;top:0;left:0;width:100%;height:100%}
#colorLayer{touch-action:none;cursor:crosshair}
#outlineLayer{pointer-events:none;mix-blend-mode:multiply}

/* ── SIDEBAR ── */
#sidebar{
  width:var(--sw);flex-shrink:0;
  background:var(--brand);
  display:flex;flex-direction:column;align-items:center;
  padding:16px 11px;gap:12px;
  overflow-y:auto;scrollbar-width:none;
  border-left:1px solid rgba(255,255,255,0.12)
}
#sidebar::-webkit-scrollbar{display:none}

/* logo */
#logo-wrap{width:100%;display:flex;justify-content:center;padding-bottom:12px;border-bottom:1px solid rgba(255,255,255,0.18)}
#logo-wrap img{width:110px}

/* labels */
.lbl{color:rgba(255,255,255,0.4);font-size:0.5rem;letter-spacing:2.5px;text-transform:uppercase;align-self:flex-start;margin-bottom:-4px}
.sep{width:100%;height:1px;background:rgba(255,255,255,0.14)}

/* palette */
#palette{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:100%}
.sw{
  aspect-ratio:1;border-radius:50%;border:2.5px solid transparent;cursor:pointer;
  box-shadow:0 3px 10px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.22);
  position:relative;transition:transform .18s cubic-bezier(.34,1.56,.64,1)
}
.sw::after{content:"";position:absolute;inset:3px;border-radius:50%;background:linear-gradient(135deg,rgba(255,255,255,.26) 0%,transparent 55%);pointer-events:none}
.sw:hover{transform:scale(1.1) translateY(-2px)}
.sw.on{border-color:#fff;transform:scale(1.14) translateY(-3px);box-shadow:0 6px 18px rgba(0,0,0,.4),0 0 0 2px rgba(255,255,255,.22),inset 0 1px 0 rgba(255,255,255,.22)}
.sw-custom{background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red);overflow:hidden}
.sw-custom input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}

/* brush sizes */
#sizes{display:flex;justify-content:space-between;width:100%;gap:5px}
.sz{flex:1;aspect-ratio:1;border-radius:50%;border:2px solid rgba(255,255,255,.18);background:rgba(255,255,255,.07);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .18s}
.sz:hover{background:rgba(255,255,255,.15)}
.sz.on{border-color:#fff;background:rgba(255,255,255,.22)}
.sz .dot{background:#fff;border-radius:50%}

/* mode */
#mode-bar{display:flex;background:rgba(0,0,0,.2);border-radius:50px;padding:3px;width:100%;border:1px solid rgba(255,255,255,.11);gap:3px}
.mbtn{flex:1;padding:8px 0;border-radius:46px;border:none;background:transparent;color:rgba(255,255,255,.42);font-family:var(--font);font-size:.53rem;letter-spacing:1.5px;cursor:pointer;transition:all .2s;text-transform:uppercase;display:flex;flex-direction:column;align-items:center;gap:2px}
.mbtn .ico{font-size:.95rem}
.mbtn.on{background:rgba(255,255,255,.18);color:#fff}

/* tools */
#tools{display:flex;flex-direction:column;gap:6px;width:100%}
.tbtn{width:100%;padding:9px 10px;border-radius:11px;border:1.5px solid rgba(255,255,255,.14);background:rgba(255,255,255,.07);color:rgba(255,255,255,.82);font-family:var(--font);font-size:.56rem;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;display:flex;align-items:center;gap:9px;transition:all .18s}
.tbtn .ico{font-size:.95rem;flex-shrink:0}
.tbtn:hover{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.32)}
.tbtn:active{transform:scale(.97)}
.tbtn.on{background:rgba(255,255,255,.22);border-color:rgba(255,255,255,.6);color:#fff}

/* lang */
#lang{margin-top:auto;display:flex;background:rgba(0,0,0,.2);border-radius:50px;padding:3px;width:100%;border:1px solid rgba(255,255,255,.11)}
.lbtn{flex:1;padding:7px 0;border-radius:46px;border:none;background:transparent;color:rgba(255,255,255,.42);font-family:var(--font);font-size:.58rem;letter-spacing:2px;cursor:pointer;transition:all .2s;text-transform:uppercase}
.lbtn.on{background:rgba(255,255,255,.18);color:#fff}

/* upload overlay */
#upload{position:fixed;inset:0;background:var(--brand);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;z-index:200}
#upload img{width:140px;margin-bottom:6px}
#upload h1{font-family:var(--font);font-size:clamp(1.1rem,2.2vw,1.8rem);color:#fff;letter-spacing:3px;text-transform:uppercase;text-align:center}
#drop{border:2px solid rgba(255,255,255,.2);border-radius:22px;padding:44px 62px;text-align:center;cursor:pointer;background:rgba(255,255,255,.07);transition:all .22s;max-width:420px;width:88%}
#drop:hover,#drop.over{border-color:rgba(255,255,255,.48);background:rgba(255,255,255,.13);transform:scale(1.02)}
#drop .em{font-size:2.8rem;margin-bottom:12px}
#drop h2{font-family:var(--font);color:#fff;font-size:.95rem;letter-spacing:2px;text-transform:uppercase;margin-bottom:7px}
#drop p{color:rgba(255,255,255,.38);font-size:.78rem}
#file-input{display:none}

/* loading */
#loading{position:fixed;inset:0;background:var(--brand);display:none;align-items:center;justify-content:center;flex-direction:column;gap:18px;z-index:300}
.spin{width:48px;height:48px;border-radius:50%;border:3px solid rgba(255,255,255,.1);border-top-color:rgba(255,255,255,.8);animation:spin .85s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.spin-lbl{color:rgba(255,255,255,.38);font-family:var(--font);font-size:.58rem;letter-spacing:3px;text-transform:uppercase}

/* toast */
#toast{position:fixed;top:22px;left:50%;transform:translateX(-50%) translateY(-60px);background:rgba(28,18,18,.9);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.11);color:#fff;font-family:var(--font);font-size:.58rem;letter-spacing:2px;text-transform:uppercase;padding:11px 26px;border-radius:50px;transition:transform .36s cubic-bezier(.34,1.56,.64,1);z-index:400;pointer-events:none;white-space:nowrap}
#toast.show{transform:translateX(-50%) translateY(0)}
</style>
</head>

  const rw=wrap.clientWidth, rh=wrap.clientHeight;
  [cC,oC].forEach(c=>{c.width=Math.round(rw*dpr);c.height=Math.round(rh*dpr);});
  w=cC.width; h=cC.height;
  cc.scale(dpr,dpr); oc.scale(dpr,dpr);
}

/* ── PALETTE ── */
document.querySelectorAll(".sw:not(.sw-custom)").forEach(sw=>{
  sw.addEventListener("click",()=>{
    document.querySelectorAll(".sw").forEach(s=>s.classList.remove("on"));
    sw.classList.add("on");
    color=sw.dataset.c;
    erasing=false;
    document.getElementById("eraser-btn").classList.remove("on");
  });
});
document.getElementById("customColor").addEventListener("input",e=>{
  color=e.target.value;
  document.querySelectorAll(".sw").forEach(s=>s.classList.remove("on"));
  e.target.closest(".sw").classList.add("on");
  erasing=false;
  document.getElementById("eraser-btn").classList.remove("on");
});

/* ── SIZES ── */
document.querySelectorAll(".sz").forEach(sz=>{
  sz.addEventListener("click",()=>{
    document.querySelectorAll(".sz").forEach(s=>s.classList.remove("on"));
    sz.classList.add("on");
    brushSize=parseInt(sz.dataset.s);
  });
});

/* ── MODE ── */
function setMode(m){
  mode=m;
  document.getElementById("btn-brush").classList.toggle("on",m==="brush");
  document.getElementById("btn-bucket").classList.toggle("on",m==="bucket");
}

/* ── TOOLS ── */
document.getElementById("eraser-btn").addEventListener("click",()=>{
  erasing=!erasing;
  document.getElementById("eraser-btn").classList.toggle("on",erasing);
  showToast(T[lang][erasing?"eraseOn":"eraseOff"]);
});

document.getElementById("undo-btn").addEventListener("click",()=>{
  if(!history.length){return;}
  const snap=history.pop();
  cc.putImageData(snap,0,0);
  showToast(T[lang].undone);
});

document.getElementById("reset-btn").addEventListener("click",()=>{
  history=[];
  cc.clearRect(0,0,w/dpr,h/dpr);
  showToast(T[lang].resetDone);
});

/* ── TOAST ── */
let toastTimer;
function showToast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg; t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove("show"),1800);
}

/* ── DRAW ── */
function saveHistory(){
  if(history.length>=40) history.shift();
  history.push(cc.getImageData(0,0,w,h));
}

function drawDot(x,y){
  cc.save();
  cc.globalCompositeOperation=erasing?"destination-out":"source-over";
  cc.fillStyle=color;
  cc.beginPath();
  cc.arc(x,y,brushSize/2,0,Math.PI*2);
  cc.fill();
  cc.restore();
}

function drawLine(x0,y0,x1,y1){
  cc.save();
  cc.globalCompositeOperation=erasing?"destination-out":"source-over";
  cc.strokeStyle=color;
  cc.lineWidth=brushSize;
  cc.lineCap="round";
  cc.lineJoin="round";
  cc.beginPath();
  cc.moveTo(x0,y0);
  cc.lineTo(x1,y1);
  cc.stroke();
  cc.restore();
}

/* ── FLOOD FILL ── */
/* Works with both transparent-bg PNGs (alpha check) and white-bg SVGs (brightness check) */
function isOutline(op,i){
  const a=op[i+3];
  if(a<128) return false; // transparent = not outline
  const r=op[i], g=op[i+1], b=op[i+2];
  const bright=(r+g+b)/3;
  return bright<160; // dark pixel = outline boundary
}

function fill(sx,sy){
  // sx,sy are CSS pixels — convert to physical canvas pixels
  const ppx=Math.round(sx*dpr), ppy=Math.round(sy*dpr);
  // Get full canvas in physical pixels
  const id=cc.getImageData(0,0,w,h);
  const p=id.data;
  const oid=oc.getImageData(0,0,w,h);
  const op=oid.data;
  const iw=w, ih=h;

  const si=(ppy*iw+ppx)*4;
  if(isOutline(op,si)) return;

  const tr=p[si],tg=p[si+1],tb=p[si+2],ta=p[si+3];
  const [fr,fg,fb]=hexToRgb(color);
  if(tr===fr&&tg===fg&&tb===fb&&ta===255) return;

  function match(i){
    return p[i]===tr&&p[i+1]===tg&&p[i+2]===tb&&p[i+3]===ta;
  }
  function setP(i){
    p[i]=fr;p[i+1]=fg;p[i+2]=fb;p[i+3]=255;
  }

  const stack=[[ppx,ppy]];
  const visited=new Uint8Array(iw*ih);
  visited[ppy*iw+ppx]=1;

  while(stack.length){
    const [cx,cy]=stack.pop();
    let x1=cx;
    while(x1>0&&match((cy*iw+(x1-1))*4)&&!isOutline(op,(cy*iw+(x1-1))*4)) x1--;
    let x2=cx;
    while(x2<iw-1&&match((cy*iw+(x2+1))*4)&&!isOutline(op,(cy*iw+(x2+1))*4)) x2++;
    for(let x=x1;x<=x2;x++){
      const i=(cy*iw+x)*4;
      setP(i);
      if(cy>0){
        const ni=((cy-1)*iw+x)*4;
        const nv=(cy-1)*iw+x;
        if(!visited[nv]&&match(ni)&&!isOutline(op,ni)){visited[nv]=1;stack.push([x,cy-1]);}
      }
      if(cy<ih-1){
        const ni=((cy+1)*iw+x)*4;
        const nv=(cy+1)*iw+x;
        if(!visited[nv]&&match(ni)&&!isOutline(op,ni)){visited[nv]=1;stack.push([x,cy+1]);}
      }
    }
  }
  cc.putImageData(id,0,0);
}

function hexToRgb(hex){
  const r=parseInt(hex.slice(1,3),16);
  const g=parseInt(hex.slice(3,5),16);
  const b=parseInt(hex.slice(5,7),16);
  return[r,g,b];
}

/* ── POINTER EVENTS ── */
function getPos(e){
  const rect=cC.getBoundingClientRect();
  const src=e.touches?e.touches[0]:e;
  return{x:src.clientX-rect.left,y:src.clientY-rect.top};
}

cC.addEventListener("pointerdown",e=>{
  e.preventDefault();
  cC.setPointerCapture(e.pointerId);
  const {x,y}=getPos(e);
  if(mode==="bucket"){
    saveHistory();
    fill(x,y);
    return;
  }
  saveHistory();
  drawing=true;
  lx=x;ly=y;
  drawDot(x,y);
},{passive:false});

cC.addEventListener("pointermove",e=>{
  if(!drawing||mode==="bucket") return;
  e.preventDefault();
  const {x,y}=getPos(e);
  drawLine(lx,ly,x,y);
  lx=x;ly=y;
},{passive:false});

cC.addEventListener("pointerup",()=>{drawing=false;lx=null;ly=null;});
cC.addEventListener("pointercancel",()=>{drawing=false;lx=null;ly=null;});

/* ── IMAGE LOAD ── */
function loadImage(src){
  const loadEl=document.getElementById("loading");
  loadEl.style.display="flex";
  const img=new Image();
  img.onload=()=>{
    requestAnimationFrame(()=>{
      setTimeout(()=>{
        document.getElementById("upload").style.display="none";
        resizeCanvases();
        const rw=wrap.clientWidth, rh=wrap.clientHeight;
        // Draw outline image scaled to fill canvas
        const sc=Math.min(rw/img.naturalWidth,rh/img.naturalHeight);
        const dw=img.naturalWidth*sc, dh=img.naturalHeight*sc;
        const dx=(rw-dw)/2, dy=(rh-dh)/2;
        oc.drawImage(img,dx,dy,dw,dh);
        loadEl.style.display="none";
        showToast(T[lang].ready);
      },80);
    });
  };
  img.onerror=()=>{loadEl.style.display="none";};
  img.src=src;
}

/* ── UPLOAD ── */
const drop=document.getElementById("drop");
const fileInput=document.getElementById("file-input");

drop.addEventListener("click",()=>fileInput.click());
drop.addEventListener("dragover",e=>{e.preventDefault();drop.classList.add("over");});
drop.addEventListener("dragleave",()=>drop.classList.remove("over"));
drop.addEventListener("drop",e=>{
  e.preventDefault();drop.classList.remove("over");
  const f=e.dataTransfer.files[0];
  if(f) readFile(f);
});
fileInput.addEventListener("change",e=>{
  const f=e.target.files[0];
  if(f) readFile(f);
});

function readFile(f){
  const reader=new FileReader();
  reader.onload=ev=>loadImage(ev.target.result);
  reader.readAsDataURL(f);
}

/* ── RESIZE ── */
window.addEventListener("resize",()=>{
  if(document.getElementById("upload").style.display==="none"){
    // re-render: just resize canvas (color layer content lost — acceptable)
    resizeCanvases();
  }
});
</script>
</body>
